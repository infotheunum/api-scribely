[project]
name = "unum-rewrite"
version = "0.1.0"
description = "scribely-rewrite: Enrichment, Rewrite/Translate, SEO/Tags/Image, Keyword Research, Prompt versioning, Style facade. gRPC-only (ТЗ §6.6)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "unum-libs",
    "grpcio>=1.75",
    "grpcio-health-checking>=1.75",
    "protobuf>=5",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[tool.uv.sources]
unum-libs = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Directory stays "app" (matches the approved repo layout in the plan),
# but the installed package is renamed per-service so api/worker/rewrite
# don't collide with each other's "app" package on the shared dev
# interpreter (same trick as scribely vs. grpc_gen in libs/pyproject.toml).
packages = [
    "rewrite_app",
    "rewrite_app.enrich",
    "rewrite_app.rewrite",
    "rewrite_app.seo",
    "rewrite_app.tags",
    "rewrite_app.image",
    "rewrite_app.keywords",
    "rewrite_app.feedback",
    "rewrite_app.prompt",
]

[tool.setuptools.package-dir]
rewrite_app = "app"
