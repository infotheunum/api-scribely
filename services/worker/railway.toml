# Railway config-as-code for the `worker` service. Root Directory should
# stay at the repo root; "Config File Path" in the dashboard points here.
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/worker/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
