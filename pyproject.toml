[tool.uv.workspace]
members = ["libs", "services/api", "services/worker", "services/rewrite"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "grpcio-tools>=1.75",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# worker (sentence-transformers, cross-language clustering ТЗ §4.2) is
# the only consumer of torch, and Railway containers have no GPU — the
# default PyPI torch wheel for Linux drags in the full CUDA stack
# (~3GB+) for nothing. `--torch-backend cpu` only affects `uv pip
# install`, not workspace `uv lock`/`uv sync` — pinning the index here
# is what actually makes the CPU-only build stick in the lockfile.
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/versions/*.py is alembic-autogenerated (long inline
# sa.ForeignKeyConstraint(...) calls) — not meant to be hand-styled.
exclude = ["**/generated", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` — not
# the mutable-default-argument bug B008 otherwise correctly flags.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "api_app.auth.dependencies.require_role",
]

[tool.pytest.ini_options]
testpaths = [
    "services/api/tests",
    "services/worker/tests",
    "services/rewrite/tests",
    "tests/e2e",
]
asyncio_mode = "auto"
# Each service's tests/ dir is a non-package directory and more than one
# service has a test_health.py — importlib mode keys modules by file path
# instead of bare module name, so same-basename files across services/*
# don't collide (classic prepend-mode pytest pitfall in a monorepo).
addopts = "--import-mode=importlib"
